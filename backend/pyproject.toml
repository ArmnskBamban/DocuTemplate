[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praktikit"
version = "0.1.0"
description = "Smart Report Template Extractor — turn a finished practicum report (.docx) into a clean, reusable template."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PraktiKit" }]
keywords = ["docx", "template", "report", "openxml", "word"]

dependencies = [
    "python-docx>=1.1",
    "lxml>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "click>=8.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
praktikit = "praktikit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/praktikit"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["praktikit"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # line length handled by formatter

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
